<?xml version="1.0" encoding="UTF-8"?>
<configuration>
    <atom type="UIElements">
        <hash type="Image" key="SYB_ShaderTree_Export">icons/Export_32.png</hash>
    </atom>
    <atom type="Attributes">

        <hash type="Sheet" key="SYB_USD_ShaderTreeExport_toolbar:sheet">
            <atom type="Label">SYB_USD_ShaderTreeExport_toolbar</atom>
            <atom type="ShowLabel">1</atom>
            <atom type="PopupFace">option</atom>
            <atom type="Enable">1</atom>
            <atom type="Alignment">default</atom>
            <atom type="Style">default</atom>
            <atom type="Export">1</atom>
            <atom type="InvertFilter">0</atom>
            <atom type="FilterCommandPriorityInfluencesTabChoice">0</atom>
            <atom type="PresetsMode">all</atom>
            <atom type="PresetIsRevertible">0</atom>
            <atom type="Layout">htoolbar</atom>
            <atom type="Justification">left</atom>
            <atom type="Columns">1</atom>
            <atom type="IconMode">both</atom>
            <atom type="IconSize">large</atom>
            <atom type="StartCollapsed">0</atom>
            <atom type="EditorColor">none</atom>
            <atom type="Proficiency">basic</atom>
            <atom type="IsWorkbench">0</atom>
            <atom type="UniqueMode">firstInstance</atom>
            <atom type="Group">SYB Kits/USD ShaderTree Export</atom>
            <list type="Control" val="ref SYB_USD_ShaderTreeExport_ExportShaderTree:sheet">
                <atom type="Label">SYB_USD_ShaderTreeExport_ExportShaderTree</atom>
                <atom type="Hash">SYB_USD_ShaderTreeExport_ExportShaderTree:sheet</atom>
            </list>
        </hash>

        <hash type="Sheet" key="SYB_USD_ShaderTreeExport_ExportShaderTree:sheet">
            <atom type="Label">SYB_USD_MainToolbar</atom>
            <atom type="Export">1</atom>
            <atom type="Layout">htoolbar</atom>
            <atom type="Justification">left</atom>
            <atom type="IconMode">both</atom>

            <atom type="Group">SYB Kits/USD ShaderTree Export</atom>

            <hash type="InCategory" key="30127543672:sheet#head">
                <atom type="Ordinal">49.50.55</atom>
            </hash>

            <list type="Control" val="cmd exportShaderTree">
                <list type="AltCmd"
                    val="attr.formPopover {SYB_USD_ShaderTreeExport_OutputOptions:sheet}">
                    <atom type="AltCmdLabel">Options</atom>
                    <atom type="AltCmdQualifiers">alt</atom>
                </list>
                <atom type="PopupFace">both</atom>
                <atom type="Label">Export Shader Tree</atom>
                <atom type="Desc">Export the shader tree to USD/XML/JSON</atom>
                <atom type="IconImage">icons/Export_32.png</atom>
            </list>
        </hash>

        <!-- Define sub form for output options -->
        <hash type="Sheet" key="SYB_USD_ShaderTreeExport_OutputOptions:sheet">
            <atom type="Label">SYB_USD_Output properties</atom>
            <atom type="ShowLabel">1</atom>
            <atom type="Layout">vtoolbar</atom>
            <atom type="Justification">left</atom>
            <atom type="IconMode">icon</atom>

            <atom type="Group">SYB Kits/USD ShaderTree Export</atom>

            <list type="Control" val="cmd user.value USDExport_export_json ?">
                <atom type="Label">Export as JSON</atom>
                <atom type="Tooltip">Export the shader tree structure as json</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_export_xml ?">
                <atom type="Label">Export as XML</atom>
                <atom type="Tooltip">Export the shader tree structure as xml</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_export_usd ?">
                <atom type="Label">Export as USD</atom>
                <atom type="Tooltip">Export the shader tree structure as USD</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_export_usda ?">
                <atom type="Label">Export as USDa</atom>
                <atom type="Tooltip">Export the shader tree structure as USDa</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_consolidateScene ?">
                <atom type="Label">Consolidate Scene</atom>
                <atom type="Tooltip">When active, all textures referenced in the shader tree are
                    copied to a local folder in the scene file folder</atom>
            </list>

            <list type="Control" val="div ">
                <atom type="Alignment">full</atom>
                <atom type="Hash">11500098344:control</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_logValueChange ?">
                <atom type="Label">Log Value Changes</atom>
                <atom type="Tooltip">Output an event log message each time a shader input value is set</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_logTreeChange ?">
                <atom type="Label">Log Tree Changes</atom>
                <atom type="Tooltip">Output an event log message each time a node is created or connected on the usd stage</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_logFileManagement ?">
                <atom type="Label">Log File Management</atom>
                <atom type="Tooltip">Output an event log message for file operations (save, consolidate, rename)</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_logUndefined ?">
                <atom type="Label">Log Unsupported / Undefined</atom>
                <atom type="Tooltip">Output an event log message when an unsupported or undefined item is encountered</atom>
            </list>

            <list type="Control" val="cmd user.value USDExport_saveDiagnostic ?">
                <atom type="Label">Save diagnostic file</atom>
                <atom type="Tooltip">Save an xml file describing all the conversions and export
                    processes</atom>
            </list>
            
            <list type="Control" val="div ">
                <atom type="Alignment">full</atom>
                <atom type="Hash">11500098344:control</atom>
            </list>

            <list type="Control" val="cmd exportShaderTree">
                <atom type="PopupFace">both</atom>
                <atom type="Label">Export Shader Tree</atom>
                <atom type="Desc">Export the shader tree to USD/XML/JSON</atom>
                <atom type="IconImage">icons/Export_32.png</atom>
            </list>
        </hash>
    </atom>
</configuration>